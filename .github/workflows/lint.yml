---
defaults:
  run:
    shell: bash

name: Lint
run-name: Run Lints for ${{ github.ref_name }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-lint
  cancel-in-progress: true

on:
  push:
    branches:
      # - main # runs via ci.yml, so we can run lint on dev only here
      - dev
  pull_request:
    branches:
      # - main # runs via ci.yml, so we can run lint on dev only here
      - dev
  workflow_call:
  workflow_dispatch:

jobs:
  lint-code:
    name: Lint Code
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: 3.12

      - name: Run Ruff
        id: ruff
        uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6

  mypy:
    name: Type Check Code
    runs-on: ubuntu-latest
    needs: lint-code
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: 3.12

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57

      - run: uv tool install mypy

      - run: mypy .
