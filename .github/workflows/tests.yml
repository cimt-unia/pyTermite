---
defaults:
  run:
    shell: bash

name: Tests
run-name: Run tests for ${{ github.ref_name }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-tests
  cancel-in-progress: true

on:
  push:
    branches:
      # - main # runs via ci.yml, so we can run lint on dev only here
      - dev
  pull_request:
    branches:
      # - main # runs via ci.yml, so we can run lint on dev only here
      - dev
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    name: Test Run (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.12", "3.13"]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .env.test file
        run: |
          mkdir -p env
          cat > env/.env.test <<'EOF'
          ${{ secrets.DOTENV_TEST }}
          EOF

      - name: Install PortAudio
        run: |
          sudo apt-get install --no-install-recommends libportaudio2
        if: ${{ matrix.os == 'ubuntu-latest' }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7

      - run: uv tool install tox --with tox-uv --with tox-gh-actions

      - run: tox

      - name: Upload coverage to Codecov
        if: ${{ matrix.os == 'ubuntu-latest' &&  matrix.python-version == '3.12'}}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
